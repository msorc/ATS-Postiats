name: Feature request
description: Suggest a change to the compiler, the libraries or the documentation
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can you not do, or do only with difficulty? A concrete program helps.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: The change, and the alternatives you considered. Keep in mind that the heap is linear-only (there is no garbage collector).
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - compiler (src/)
        - prelude / libats
        - tools (patscc, myatscc, atsdoc, pats2xhtml)
        - build and install
        - documentation
        - other
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would send a pull request for this
