#
# The pre-requisites of the build of ATS2 on a runner. The first compiler
# (stage 0) is the tracked bootstrap bundle src/CBOOT, so a C compiler, make,
# python3 and libgmp are all that is needed: no ATS2 release is downloaded.
#
# The only cache is ccache (the C objects of the bundle and of the compiler,
# keyed by the content of the compiled files, so a stale entry cannot be used;
# the cache key only decides which entries are restored). The key hashes the
# inputs of the C compilation (the bootstrap bundle, the sources of the
# compiler, the CATS and .cats of the libraries and the runtime headers), so
# a change in them means new entries: a hash of the bundle alone would make
# a change of the compiler sources reuse a cache of a build that recompiles
# almost everything. The Makefiles that drive the C compilation and the
# share/atsmake-*.mk variables are hashed as well. The restore-keys may fall
# back on the cache of one of the other jobs: ccache hashes again inside the
# entry, the objects are not warm to a different job, and a full cache
# evicts the entries it needs less; CCACHE_MAXSIZE (2G) holds the C objects
# of two compilers (about 1G of C out of the tree).
#
name: setup
description: the packages of the build of ATS2 and the ccache cache

inputs:
  key:
    description: the name of the job (the ccache cache of a job is its own)
    required: true
  packages:
    description: more apt (Linux) or brew (macOS) packages, separated by spaces
    required: false
    default: ""
  ccache:
    description: "use ccache (Linux only): 'true' or 'false'"
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: the packages (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential python3 libgmp-dev autoconf automake ccache ${{ inputs.packages }}

    - name: the packages (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install gmp autoconf automake ${{ inputs.packages }}
        # <gmp.h> and libgmp are not on the default search paths of the compilers
        echo "CPATH=$(brew --prefix gmp)/include" >> "$GITHUB_ENV"
        echo "LIBRARY_PATH=$(brew --prefix gmp)/lib" >> "$GITHUB_ENV"

    - name: ccache
      if: runner.os == 'Linux' && inputs.ccache == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ccache-${{ runner.os }}-${{ inputs.key }}-${{ hashFiles('src/CBOOT/**', 'src/*.dats', 'src/*.sats', 'src/*.hats', 'src/*.cats', 'prelude/CATS/*', 'libats/CATS/*', 'ccomp/runtime/*', 'src/Makefile', 'Makefile_devl', 'share/atsmake-pre.mk', 'share/atsmake-post.mk') }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ inputs.key }}-
          ccache-${{ runner.os }}-

    - name: ccache in front of the compilers
      if: runner.os == 'Linux' && inputs.ccache == 'true'
      shell: bash
      run: |
        # /usr/lib/ccache holds gcc, cc, clang, ... that run ccache; CC=gcc and the cc of patscc find them first
        echo "/usr/lib/ccache" >> "$GITHUB_PATH"
        echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
        echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
